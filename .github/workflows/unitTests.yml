name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      fail-fast: true
      matrix:
        node: [18]

    name: Unit tests (Jest)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        uses: './.github/actions/install-deps'

      - name: Run tests
        run: |
          if git diff --name-only HEAD^1 | grep -q '^apps/web/'; then
          pnpm test:ci
          else
          pnpm turbo run test:translations --filter=web
          fi
