version: '3.8'

services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ../../node_modules:/app/node_modules:ro
      - ../../packages:/packages:ro
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    command: sh -c "npm install -g pnpm && pnpm start"
