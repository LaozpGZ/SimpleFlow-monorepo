version: '3.8'

services:
  # 方式1: 使用预构建的镜像运行
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.build
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G
    restart: unless-stopped

  # 方式2: 使用本地已构建的 standalone 输出运行
  web-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    profiles:
      - standalone
    restart: unless-stopped
